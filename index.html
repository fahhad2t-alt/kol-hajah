<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كل حاجة</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #fff;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      font-size: 18px;
    }

    .search {
      max-width: 650px;
      margin: 25px auto;
    }

    .search input {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .categories {
      max-width: 900px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 15px;
      padding: 15px;
    }

    .category {
      background: white;
      padding: 25px 10px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.08);
    }

    .add {
      display: block;
      width: 220px;
      margin: 35px auto;
      padding: 15px;
      background: #222;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media(max-width:600px) {
      .categories {
        grid-template-columns: repeat(2,1fr);
      }

      .hero h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">كل حاجة</div>
</header>

<section class="hero">
  <h1>دور على أي حاجة 🔎</h1>
  <p>اطلب الشيء اللي تبحث عنه، ونحاول نوفره لك.</p>

  <div class="search">
    <input type="text" placeholder="وش تدور عليه؟">
  </div>
</section>

<div class="categories">
  <div class="category">🚗 السيارات</div>
  <div class="category">👕 الملابس</div>
  <div class="category">🏠 العقارات</div>
  <div class="category">🏺 الأشياء النادرة</div>
</div>

<a class="add" href="add.html">+ أضف إعلانك</a>

<footer>
  مشروع كل حاجة © 2026
</footer>

</body>
</html>
