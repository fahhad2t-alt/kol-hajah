<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إضافة إعلان - كل حاجة</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">كل حاجة</div>
    </header>

    <div class="container">

        <h1>أضف إعلانك</h1>

        <form>

            <label>عنوان الإعلان</label>
            <input type="text" placeholder="مثال: هايلوكس 2008 للبيع" required>

            <label>السعر</label>
            <input type="number" placeholder="اكتب السعر" required>

            <label>القسم</label>
            <select required>
                <option value="">اختر القسم</option>
                <option>سيارات</option>
                <option>جوالات</option>
                <option>عقار</option>
                <option>أثاث</option>
                <option>إلكترونيات</option>
                <option>ملابس</option>
                <option>رياضة</option>
                <option>أخرى</option>
            </select>

            <label>صورة الإعلان</label>
            <input type="file" accept="image/*">

            <label>وصف الإعلان</label>
            <textarea placeholder="اكتب تفاصيل المنتج هنا..." required></textarea>

            <label>رقم التواصل</label>
            <input type="tel" placeholder="05xxxxxxxx" required>

            <button type="submit">نشر الإعلان</button>

        </form>

    </div>
<script type="module" src="script.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
